mqtt:
  enabled: False

ffmpeg:
  hwaccel_args: preset-vaapi

# go2rtc toma el video HD directamente de la cámara por TCP y lo reparte
go2rtc:
  streams:
    imou_cruiser_ptz:
      - "exec:ffmpeg -hide_banner -loglevel error -rtsp_transport tcp -i rtsp://admin:L2xr1zum@192.168.100.124:554/cam/realmonitor?channel=1&subtype=0 -c copy -rtsp_transport tcp -f rtsp rtsp://127.0.0.1:8554/imou_cruiser_ptz"
    imou_cruiser_fija:
      - "exec:ffmpeg -hide_banner -loglevel error -rtsp_transport tcp -i rtsp://admin:L2xr1zum@192.168.100.124:554/cam/realmonitor?channel=2&subtype=0 -c copy -rtsp_transport tcp -f rtsp rtsp://127.0.0.1:8554/imou_cruiser_fija"

cameras:
  imou_cruiser_ptz:
    ffmpeg:
      inputs:
        # Grabación desde el re-stream local de go2rtc
        - path: rtsp://127.0.0.1:8554/imou_cruiser_ptz
          roles:
            - record
        # Detección directa usando el stream secundario en baja resolución
        - path: rtsp://admin:L2xr1zum@192.168.100.124:554/cam/realmonitor?channel=1&subtype=1
          input_args: preset-rtsp-generic
          roles:
            - detect

    detect:
      enabled: True
      width: 640
      height: 480
      fps: 5

    record:
      enabled: True
      retain:
        days: 7
        mode: all

    onvif:
      host: 192.168.100.124
      port: 80
      user: admin
      password: L2xr1zum

  imou_cruiser_fija:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/imou_cruiser_fija
          roles:
            - record
        - path: rtsp://admin:L2xr1zum@192.168.100.124:554/cam/realmonitor?channel=2&subtype=1
          input_args: preset-rtsp-generic
          roles:
            - detect

    detect:
      enabled: True
      width: 640
      height: 480
      fps: 5

    record:
      enabled: True
      retain:
        days: 7
        mode: all