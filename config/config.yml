mqtt:
  enabled: False

ffmpeg:
  hwaccel_args: preset-vaapi

go2rtc:
  streams:
    imou_cruiser_ptz:
      - "rtsp://admin:L2xr1zum@192.168.100.124:554/cam/realmonitor?channel=1&subtype=0#transport=tcp"
    imou_cruiser_fija:
      - "rtsp://admin:L2xr1zum@192.168.100.124:554/cam/realmonitor?channel=2&subtype=0#transport=tcp"

cameras:
  imou_cruiser_ptz:
    ffmpeg:
      input_args: preset-rtsp-generic
      inputs:
        - path: rtsp://admin:L2xr1zum@192.168.100.124:554/cam/realmonitor?channel=1&subtype=0
          roles:
            - record
        - path: rtsp://admin:L2xr1zum@192.168.100.124:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect

    detect:
      enabled: True
      width: 640
      height: 480
      fps: 5

    record:
      enabled: True
      retain:
        days: 7
        mode: all

    onvif:
      host: 192.168.100.124
      port: 80
      user: admin
      password: L2xr1zum

  imou_cruiser_fija:
    ffmpeg:
      input_args: preset-rtsp-generic
      inputs:
        - path: rtsp://admin:L2xr1zum@192.168.100.124:554/cam/realmonitor?channel=2&subtype=0
          roles:
            - record
        - path: rtsp://admin:L2xr1zum@192.168.100.124:554/cam/realmonitor?channel=2&subtype=1
          roles:
            - detect

    detect:
      enabled: True
      width: 640
      height: 480
      fps: 5

    record:
      enabled: True
      retain:
        days: 7
        mode: all