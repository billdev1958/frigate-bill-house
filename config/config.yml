mqtt:
  enabled: False

# Aceleración por hardware con GPU AMD Vega
ffmpeg:
  hwaccel_args: preset-vaapi

cameras:
  # Lente 1: Cámara PTZ (Canal 1)
  imou_cruiser_ptz:
    ffmpeg:
      input_args: preset-rtsp-generic
      inputs:
        # Stream HD nativo para grabar
        - path: rtsp://admin:L2xr1zum@192.168.100.124:554/cam/realmonitor?channel=1&subtype=0
          roles:
            - record
        # Stream SD nativo para detección
        - path: rtsp://admin:L2xr1zum@192.168.100.124:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect

    detect:
      enabled: True
      width: 640
      height: 480
      fps: 5

    record:
      enabled: True
      retain:
        days: 7
        mode: all

    onvif:
      host: 192.168.100.124
      port: 80
      user: admin
      password: L2xr1zum

  # Lente 2: Cámara Fija (Canal 2)
  imou_cruiser_fija:
    ffmpeg:
      input_args: preset-rtsp-generic
      inputs:
        # Stream HD nativo para grabar
        - path: rtsp://admin:L2xr1zum@192.168.100.124:554/cam/realmonitor?channel=2&subtype=0
          roles:
            - record
        # Stream SD nativo para detección
        - path: rtsp://admin:L2xr1zum@192.168.100.124:554/cam/realmonitor?channel=2&subtype=1
          roles:
            - detect

    detect:
      enabled: True
      width: 640
      height: 480
      fps: 5

    record:
      enabled: True
      retain:
        days: 7
        mode: all